name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.6
      - name: Byte-compile all Python files
        run: python -m compileall -q .
      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 --output-format=github .
